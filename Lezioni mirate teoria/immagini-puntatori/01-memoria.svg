<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#137D80"/></marker></defs><rect width="1000" height="300" rx="18" fill="#FFFFFF"/><g font-family="Arial,Helvetica,sans-serif">
<text x="42" y="42" font-size="26" font-weight="700" fill="#132238">Il puntatore occupa memoria propria</text>
<rect x="72" y="92" width="290" height="132" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
<text x="100" y="124" font-size="23" font-weight="700" fill="#132238">p  :  int *</text>
<text x="100" y="159" font-size="19" fill="#63748B">indirizzo di p: 0x2000</text>
<text x="100" y="198" font-size="23" font-weight="700" fill="#137D80">contenuto: 0x1000</text>
<path d="M366 158 L627 158" stroke="#137D80" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
<text x="496" y="133" text-anchor="middle" font-size="19" fill="#137D80">p = &amp;x</text>
<rect x="637" y="92" width="290" height="132" rx="14" fill="#E4F5F3" stroke="#137D80" stroke-width="2"/>
<text x="665" y="124" font-size="23" font-weight="700" fill="#132238">x  :  int</text>
<text x="665" y="159" font-size="19" fill="#63748B">indirizzo di x: 0x1000</text>
<text x="665" y="198" font-size="23" font-weight="700" fill="#137D80">contenuto: 10</text>
<text x="500" y="272" font-size="17" text-anchor="middle" fill="#63748B">Gli indirizzi sono inventati per illustrare il concetto.</text>
</g></svg>